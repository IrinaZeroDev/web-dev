<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Текущие дата и время</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 50px;
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 32px;
        }
        
        .info-block {
            margin: 20px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        
        .label {
            font-size: 14px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        
        .value {
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
        }
        
        .datetime-display {
            margin-top: 40px;
            padding: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            color: white;
        }
        
        .datetime-display .label {
            color: rgba(255, 255, 255, 0.8);
        }
        
        .datetime-display .value {
            color: white;
            font-size: 32px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⛰ Текущие дата и время</h1>
        
        <div class="info-block">
            <div class="label">Дата</div>
            <div class="value">{{ date }}</div>
        </div>
        
        <div class="info-block">
            <div class="label">Время</div>
            <div class="value">{{ time }}</div>
        </div>
        
        <div class="datetime-display">
            <div class="label">Полная информация</div>
            <div class="value">{{ datetime_str }}</div>
        </div>
    </div>
</body>
</html>
