<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <h1 class="logo">Мою веб-сайт</h1>
        <ul class="nav-menu">
            {% for item in nav %}
            <li><a href="{{ item.url }}" {% if current_page == 'contacts' and item.url == '/contacts' %}class="active"{% endif %}>{{ item.title }}</a></li>
            {% endfor %}
        </ul>
    </nav>

    <main class="container">
        <h2>Контакты</h2>
        <p>Свяжитесь с нами:</p>
        
        <section class="contact-info">
            <div class="contact-item">
                <h3>Почта:</h3>
                <p><a href="mailto:{{ contact.email }}">{{ contact.email }}</a></p>
            </div>
            
            <div class="contact-item">
                <h3>Телефон:</h3>
                <p><a href="tel:{{ contact.phone }}">{{ contact.phone }}</a></p>
            </div>
            
            <div class="contact-item">
                <h3>Адрес:</h3>
                <p>{{ contact.address }}</p>
            </div>
        </section>
        
        <section class="contact-form">
            <h3>Отправить сообщение:</h3>
            <form>
                <input type="text" placeholder="Ваше имя" required>
                <input type="email" placeholder="Ваша почта" required>
                <textarea placeholder="Ваше сообщение" rows="5" required></textarea>
                <button type="submit">Отправить</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Мою Flask веб-сайт. Все права защищены.</p>
    </footer>
</body>
</html>
